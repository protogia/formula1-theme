{{ $baseurl := .Site.BaseURL }}

<!DOCTYPE html>

{{ partial "head.html" . }}

  <script src="https://cdn.plot.ly/plotly-3.1.2.min.js" defer></script>

  <body>

  {{ partial "header.html" . }}


    <main role="main" class="single">
      <div class="content-area">
        {{ range .Pages.ByDate }}
          <h3>
            <span>{{ .Title }}{{ if .Draft }} (draft){{ end }}</span>
          </h3>

          {{ .Content }}
        {{ end }}
      </div>
      <div class="toc-area">
        <!-- {{ .TableOfContents }} -->
      </div>
    </main>

  {{ partial "footer.html" . }}
  </body>
</html>
